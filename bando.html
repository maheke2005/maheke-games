<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MZURIKWAO BUNDO KITONGA</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #090d16, #1e1b4b);
      color: #f8fafc;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    .banner {
      background: linear-gradient(120deg, #dc2626, #f59e0b, #7c3aed);
      background-size: 200% 200%;
      animation: gradientMove 4s ease infinite;
      color: #ffffff;
      padding: 24px 18px;
      border-radius: 16px;
      text-align: center;
      margin-bottom: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
    }

    .banner h1 {
      font-size: 1.55rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 8px;
      animation: flashText 1.4s infinite alternate;
    }

    .banner p {
      font-size: 0.92rem;
      opacity: 0.95;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes flashText {
      0% { color: #ffffff; transform: scale(1); }
      100% { color: #fef08a; transform: scale(1.03); }
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 16px;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 20px;
      text-align: center;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: #38bdf8;
    }

    .tag {
      display: inline-block;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .size {
      font-size: 1.8rem;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .price {
      font-size: 1.1rem;
      color: #4ade80;
      font-weight: bold;
      margin-bottom: 14px;
    }

    .details {
      font-size: 0.85rem;
      color: #cbd5e1;
      margin-bottom: 18px;
    }

    button {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 10px;
      background: #38bdf8;
      color: #0f172a;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .status-box {
      margin-top: 22px;
      background: #0f172a;
      border-left: 4px solid #4ade80;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 0.92rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="banner">
      <h1>MZURIKWAO BUNDO KITONGA</h1>
      <p>Chagua kifurushi cha majaribio ili kuona mwitikio wa ukurasa</p>
    </div>

    <div class="grid">
      <div class="card">
        <span class="tag">Kila Siku</span>
        <div class="size">1.5 GB</div>
        <div class="price">TZS 1,000</div>
        <div class="details">Kasi kubwa • Saa 24</div>
        <button onclick="chaguaBando('1.5 GB (TZS 1,000 - Saa 24)')">Chagua Ofa</button>
      </div>

      <div class="card">
        <span class="tag">Wiki Nzima</span>
        <div class="size">7 GB</div>
        <div class="price">TZS 5,000</div>
        <div class="details">Inafaa mitandao yote • Siku 7</div>
        <button onclick="chaguaBando('7 GB (TZS 5,000 - Siku 7)')">Chagua Ofa</button>
      </div>

      <div class="card">
        <span class="tag">Mwezi Poa</span>
        <div class="size">25 GB</div>
        <div class="price">TZS 15,000</div>
        <div class="details">Bando kubwa • Siku 30</div>
        <button onclick="chaguaBando('25 GB (TZS 15,000 - Siku 30)')">Chagua Ofa</button>
      </div>
    </div>

    <div id="statusBox" class="status-box"></div>
  </div>

  <script>
    function chaguaBando(jina) {
      const box = document.getElementById("statusBox");
      box.style.display = "block";
      box.innerHTML = "Umechagua kifurushi cha: <strong>" + jina + "</strong>";
    }
  </script>
</body>
</html>
